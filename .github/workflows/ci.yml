name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bange
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bange_agenda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bange" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bange:ci-only-password@localhost:5432/bange_agenda_test?schema=public
      DATABASE_URL: postgresql://bange:ci-only-password@localhost:5432/bange_agenda_test?schema=public
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -w apps/api prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E
        run: |
          npx -w apps/web playwright install --with-deps chromium
          npm -w apps/web run e2e
